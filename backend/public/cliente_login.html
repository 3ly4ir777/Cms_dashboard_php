<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Cliente 🐧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f4f6f9;height:100vh;display:flex;align-items:center}</style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card p-5 bg-white" style="max-width:400px;width:100%;border:none;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.05)">
            <h2 class="fw-bold mb-4 text-center">Tienda 🛒</h2>
            <div id="alerta" class="alert d-none"></div>
            <form id="form">
            <div class="mb-3"><label class="form-label">Usuario</label>
                <input id="usuario" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control" required></div>
            <button class="btn btn-primary w-100 rounded-pill">Entrar</button>
            </form>
            <hr class="my-4">
            <div class="text-center">
            <small>¿No tienes cuenta? <a href="register.html">Regístrate</a></small><br>
            <small class="text-muted">¿Eres admin? <a href="login.html">Login admin</a></small>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const alerta = document.getElementById('alerta');
    const body = {
        usuario:  document.getElementById('usuario').value,
        password: document.getElementById('password').value,
    };
    try {
        const r = await fetch('cliente_login_api.php', {
        method: 'POST', credentials:'include',
        headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        const d = await r.json();
        alerta.className = 'alert ' + (r.ok ? 'alert-success' : 'alert-danger');
        alerta.textContent = d.message;
        if (r.ok) setTimeout(() => location.href = 'tienda.html', 1000);
    } catch (err) { alerta.className='alert alert-danger'; alerta.textContent='Error de red'; }
    });
    </script>
</body>
</html>
