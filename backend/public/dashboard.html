<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin 🐧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .navbar-brand { font-weight: 700; }
        .stat-card { border: none; border-radius: 15px; box-shadow: 0 6px 15px rgba(0,0,0,.05); }
        .stat-num { font-size: 2rem; font-weight: 700; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <span class="navbar-brand">🐧 EliasCms</span>
    <div class="ms-auto">
        <span class="text-white me-3" id="userName"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Salir</button>
    </div>
</nav>

<div class="container py-4">
    <ul class="nav nav-tabs mb-3" id="tabs">
        <li class="nav-item"><button class="nav-link active" data-tab="home">🏠 Inicio</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="productos">📦 Productos</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="ordenes">🧾 Órdenes</button></li>
    </ul>

    <!-- HOME -->
    <div class="tab-pane" id="tab-home">
        <div class="row g-3" id="statsRow"></div>
        <h4 class="mt-4">Órdenes recientes</h4>
        <div class="table-responsive"><table class="table table-hover bg-white" id="ordenesRecientes"></table></div>
    </div>

    <!-- PRODUCTOS -->
    <div class="tab-pane d-none" id="tab-productos">
        <button class="btn btn-success mb-3" onclick="nuevoProducto()">➕ Nuevo producto</button>
        <div class="table-responsive"><table class="table table-hover bg-white">
            <thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoría</th><th></th></tr></thead>
            <tbody id="productosBody"></tbody>
        </table></div>
    </div>

    <!-- ORDENES -->
    <div class="tab-pane d-none" id="tab-ordenes">
        <div class="table-responsive"><table class="table table-hover bg-white">
            <thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Fecha</th><th></th></tr></thead>
            <tbody id="ordenesBody"></tbody>
        </table></div>
    </div>
</div>

<!-- Modal simple para productos -->
<div class="modal fade" id="modalProducto" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="prod-id">
        <div class="mb-2"><label class="form-label">Nombre</label><input id="prod-nombre" class="form-control"></div>
        <div class="mb-2"><label class="form-label">Descripción</label><textarea id="prod-desc" class="form-control"></textarea></div>
        <div class="row">
            <div class="col mb-2"><label class="form-label">Precio</label><input id="prod-precio" type="number" step="0.01" class="form-control"></div>
            <div class="col mb-2"><label class="form-label">Stock</label><input id="prod-stock" type="number" class="form-control"></div>
        </div>
        <div class="mb-2"><label class="form-label">Categoría</label><input id="prod-cat" class="form-control"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="guardarProducto()">Guardar</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '';
const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('modalProducto'));

// --- auth ---
async function checkAuth() {
    const r = await fetch('check_auth.php', { credentials: 'include' });
    if (!r.ok) { location.href = 'login.html'; return null; }
    return (await r.json()).user;
}
async function logout() {
    await fetch('logout_api.php', { credentials: 'include' });
    location.href = 'login.html';
}

// --- tabs ---
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    ['home','productos','ordenes'].forEach(t => document.getElementById('tab-'+t).classList.add('d-none'));
    document.getElementById('tab-'+b.dataset.tab).classList.remove('d-none');
    if (b.dataset.tab === 'productos') cargarProductos();
    if (b.dataset.tab === 'ordenes')   cargarOrdenes();
}));

// --- home ---
async function cargarStats() {
    const r = await fetch('dashboard_api.php', { credentials: 'include' });
    const d = await r.json();
    const s = d.stats;
    const cards = [
        ['Productos', s.total_productos, 'primary'],
        ['Stock total', s.stock_total, 'info'],
        ['Órdenes', s.total_ordenes, 'warning'],
        ['Pendientes', s.ordenes_pendientes, 'danger'],
        ['Ingresos', '$' + Number(s.ingresos_totales).toFixed(2), 'success'],
    ];
    document.getElementById('statsRow').innerHTML = cards.map(([t,v,c]) =>
        `<div class="col-md-4 col-lg"><div class="card stat-card p-3">
            <small class="text-muted">${t}</small>
            <div class="stat-num text-${c}">${v}</div></div></div>`).join('');

    document.getElementById('ordenesRecientes').innerHTML =
        `<thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>` +
        d.ordenes_recientes.map(o => `<tr>
            <td>${o.id}</td><td>${o.cliente_nombre}</td>
            <td>$${Number(o.total).toFixed(2)}</td>
            <td><span class="badge bg-secondary">${o.estado}</span></td>
            <td>${o.created_at}</td></tr>`).join('') + '</tbody>';
}

// --- productos ---
async function cargarProductos() {
    const r = await fetch('productos_api.php', { credentials: 'include' });
    const d = await r.json();
    document.getElementById('productosBody').innerHTML = d.data.map(p => `<tr>
        <td>${p.id}</td><td>${p.nombre}</td>
        <td>$${Number(p.precio).toFixed(2)}</td>
        <td>${p.stock}</td><td>${p.categoria ?? ''}</td>
        <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" onclick='editarProducto(${JSON.stringify(p)})'>✏️</button>
            <button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto(${p.id})">🗑️</button>
        </td></tr>`).join('');
}
function nuevoProducto() {
    ['id','nombre','desc','precio','stock','cat'].forEach(k => document.getElementById('prod-'+k).value = '');
    modal().show();
}
function editarProducto(p) {
    document.getElementById('prod-id').value = p.id;
    document.getElementById('prod-nombre').value = p.nombre;
    document.getElementById('prod-desc').value = p.descripcion ?? '';
    document.getElementById('prod-precio').value = p.precio;
    document.getElementById('prod-stock').value = p.stock;
    document.getElementById('prod-cat').value = p.categoria ?? '';
    modal().show();
}
async function guardarProducto() {
    const id = document.getElementById('prod-id').value;
    const body = {
        nombre: document.getElementById('prod-nombre').value,
        descripcion: document.getElementById('prod-desc').value,
        precio: parseFloat(document.getElementById('prod-precio').value || 0),
        stock: parseInt(document.getElementById('prod-stock').value || 0),
        categoria: document.getElementById('prod-cat').value,
    };
    if (id) body.id = parseInt(id);
    await fetch('productos_api.php', {
        method: id ? 'PUT' : 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    modal().hide();
    cargarProductos();
}
async function eliminarProducto(id) {
    if (!confirm('¿Eliminar producto?')) return;
    await fetch('productos_api.php?id=' + id, { method: 'DELETE', credentials: 'include' });
    cargarProductos();
}

// --- ordenes ---
async function cargarOrdenes() {
    const r = await fetch('ordenes_api.php', { credentials: 'include' });
    const d = await r.json();
    const estados = ['pendiente','pagada','enviada','entregada','cancelada'];
    document.getElementById('ordenesBody').innerHTML = d.data.map(o => `<tr>
        <td>${o.id}</td><td>${o.cliente_nombre}</td>
        <td>$${Number(o.total).toFixed(2)}</td>
        <td>
            <select class="form-select form-select-sm" onchange="cambiarEstado(${o.id}, this.value)">
                ${estados.map(e => `<option ${e===o.estado?'selected':''}>${e}</option>`).join('')}
            </select>
        </td>
        <td>${o.created_at}</td>
        <td><button class="btn btn-sm btn-outline-danger" onclick="eliminarOrden(${o.id})">🗑️</button></td>
    </tr>`).join('');
}
async function cambiarEstado(id, estado) {
    await fetch('ordenes_api.php', {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, estado })
    });
    cargarStats();
}
async function eliminarOrden(id) {
    if (!confirm('¿Eliminar orden?')) return;
    await fetch('ordenes_api.php?id=' + id, { method: 'DELETE', credentials: 'include' });
    cargarOrdenes();
}

// --- init ---
(async () => {
    const user = await checkAuth();
    if (!user) return;
    document.getElementById('userName').textContent = '👤 ' + user.usuario;
    cargarStats();
})();
</script>
</body>
</html>
