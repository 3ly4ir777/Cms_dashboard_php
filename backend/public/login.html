<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador 🐣</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; }
        .card-login { max-width: 400px; width: 100%; border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="card card-login p-5 bg-white">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark">¡Hola de nuevo! 🐧</h2>
                <p class="text-muted">Ingresa tus credenciales de Administrador</p>
            </div>

            <!-- Alerta flotante para errores o éxito -->
            <div id="alerta" class="alert d-none" role="alert"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Nombre de Usuario</label>
                    <input type="text" id="usuario" class="form-control form-control-lg" placeholder="ej: usuario" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Código Especial (Admin)</label>
                    <input type="number" id="codigo_especial" class="form-control form-control-lg" placeholder="ej: 777" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm">Iniciar Sesión 🚀</button>
            </form>
        </div>
    </div>

    <!-- JavaScript para conectar con Podman con Fetch -->
    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evitar que la página se recargue

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const codigo_especial = parseInt(document.getElementById('codigo_especial').value);
            const alerta = document.getElementById('alerta');

            // Los datos tal y como los espera recibir tu AuthController en json_decode
            const datos = {
                usuario: usuario,
                password: password,
                codigo_especial: codigo_especial
            };

            //si la pagna esta en frontend entonces seria fetch('http://localhost:8080/backend/login_api.php', { ... }) pero como esta en el mismo origen, no hace falta poner la url completa, solo el nombre del archivo
            try {
                const respuesta = await fetch('login_api.php', {   //misma origin 
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                // Leer como texto PRIMERO (por si no es JSON)
                const texto = await respuesta.text();
                let resultado;
                try {
                    resultado = JSON.parse(texto);
                } catch (e) {
                    // El servidor devolvió HTML → error fatal de PHP
                    console.error('Respuesta NO es JSON:', texto);
                    alerta.classList.remove('d-none', 'alert-success');
                    alerta.classList.add('alert-danger');
                    alerta.innerHTML = `<strong>Error del servidor (HTTP ${respuesta.status}):</strong><br>
                        <small>Revisa la consola (F12) o los logs de Podman.</small>`;
                    return;
                }

                alerta.classList.remove('d-none', 'alert-danger', 'alert-success');
                if (respuesta.ok) {
                    alerta.classList.add('alert-success');
                    alerta.textContent = resultado.message + ' 🎉 Redirigiendo...';
                    setTimeout(() => location.href = 'dashboard.html', 1200);
                } else {
                    alerta.classList.add('alert-danger');
                    alerta.textContent = resultado.message || `Error HTTP ${respuesta.status}`;
                }
            } catch (error) {
                // Aquí SÍ es error de red real
                console.error('Error de fetch:', error);
                alerta.classList.remove('d-none', 'alert-success');
                alerta.classList.add('alert-danger');
                alerta.innerHTML = `<strong>No se pudo contactar al servidor.</strong><br>
                    <small>${error.message}</small><br>
                    <small>¿Está corriendo Podman? ¿La URL es la correcta?</small>`;
            }
        });
    </script>

</body>
</html>
